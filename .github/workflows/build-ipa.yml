name: Build IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gevun-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Check formatting
        run: swift format lint --strict --recursive Gevun Core/Sources Core/Tests Scripts Package.swift Core/Package.swift
      - name: Run core tests
        run: swift test --package-path Core --scratch-path "$RUNNER_TEMP/gevun-core-tests"
      - name: Render native icon appearances
        run: bash Scripts/RenderIconPreviews.sh dist/icon-previews
      - name: Build and verify unsigned IPA
        run: bash Scripts/BuildIPA.sh "$RUNNER_TEMP/gevun-build" dist/Gevun.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Gevun
          path: dist/Gevun.ipa
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload icon previews
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Gevun-icon-previews
          path: dist/icon-previews
          if-no-files-found: error
          retention-days: 7
